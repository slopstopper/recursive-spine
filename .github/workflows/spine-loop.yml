name: spine-loop
on:
  schedule:
    - cron: "0 8 * * 6"   # Saturday 08:00 UTC
  workflow_dispatch: {}
# This job holds the highest-value secrets in the public repos (sweep PAT,
# Anthropic key, Slack webhook), so the job's own GITHUB_TOKEN gets read-only.
# Cross-repo reads and private-hive writes go through SPINE_SWEEP_TOKEN, not
# this token. If sweep-token is ever left empty and the tracking issue moves
# into this repo, the github.token fallback will also need `issues: write`.
permissions:
  contents: read
jobs:
  loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: ./loop
        with:
          repos: "slopstopper/recursive-spine slopstopper/plumb-line slopstopper/tokenomics effythealien/Veska_Index_App"
          tracking-issue: "effythealien/private-hive#2"
          mention: "@effythealien"
          ledger: "effythealien/private-hive:nudges/ledger.md"
          # The private aggregate board is the one auto-add cannot serve: it is
          # user-owned, so its picker does not list slopstopper repos at all
          # (#128). Per-repo boards can use their own single auto-add slot; this
          # one has to be swept. Private target, so public repos carry no leak —
          # and the sweep refuses the reverse direction regardless.
          # Requires SPINE_SWEEP_TOKEN to carry `project` scope; without it the
          # adds are reported as failures rather than silently skipped.
          board: "effythealien/2"
          sweep-token: ${{ secrets.SPINE_SWEEP_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
